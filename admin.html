<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | In & Out Laundry</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🧺</div>
        In & Out Laundry — Admin
      </a>
      <ul class="nav-links">
        <li><a href="admin.html" class="active">All Bookings</a></li>
        <li><a href="#" onclick="logout(); return false;" class="btn btn-outline btn-sm">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-header">
      <div>
        <h2>Admin Dashboard</h2>
        <p style="color:var(--gray)">Manage all customer bookings and update statuses</p>
      </div>
    </div>

    <div class="stats-grid" id="stats"></div>
    <div id="alertBox"></div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Order #</th>
            <th>Customer ID</th>
            <th>Service</th>
            <th>Total</th>
            <th>Collection</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="adminBody"></tbody>
      </table>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 In & Out Laundry · Admin Panel</p>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (!user || user.role !== 'admin') {
        alert('Admin access only.');
        window.location.href = 'login.html';
        return;
      }

      function render() {
        const bookings = getAllBookings();
        const statuses = ['Pending', 'Collected', 'Washing', 'Ready', 'Delivered'];

        // Stats
        document.getElementById('stats').innerHTML = `
          <div class="stat-card"><div class="label">Total Orders</div><div class="value">${bookings.length}</div></div>
          <div class="stat-card"><div class="label">Pending</div><div class="value">${bookings.filter(b => b.status === 'Pending').length}</div></div>
          <div class="stat-card"><div class="label">In Progress</div><div class="value">${bookings.filter(b => ['Collected','Washing'].includes(b.status)).length}</div></div>
          <div class="stat-card"><div class="label">Completed</div><div class="value">${bookings.filter(b => b.status === 'Delivered').length}</div></div>
        `;

        document.getElementById('adminBody').innerHTML = bookings.map(b => `
          <tr>
            <td><strong>#${b.id}</strong></td>
            <td>${b.userId}</td>
            <td>${b.serviceName} (×${b.quantity})</td>
            <td>${formatCurrency(b.total)}</td>
            <td>${formatDate(b.collectionDate)}</td>
            <td><span class="status ${statusClass(b.status)}">${b.status}</span></td>
            <td>
              <select class="form-control" style="width:auto;padding:0.3rem 0.5rem;font-size:0.85rem"
                      onchange="changeStatus(${b.id}, this.value)">
                ${statuses.map(s => `<option value="${s}" ${s === b.status ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
          </tr>
        `).join('');
      }

      window.changeStatus = function(id, status) {
        if (updateBookingStatus(id, status)) {
          showAlert('alertBox', `Order #${id} updated to "${status}".`, 'success');
          render();
        }
      };

      render();
    });
  </script>
</body>
</html>
