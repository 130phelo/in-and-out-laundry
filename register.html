<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | In & Out Laundry</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🧺</div>
        In & Out Laundry
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Log In</a></li>
      </ul>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="subtitle">Join In & Out Laundry today</p>
      <div id="alertBox"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Thabo Molefe" required />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="083 123 4567" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6" />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" class="form-control" placeholder="Repeat password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        showAlert('alertBox', 'Passwords do not match.', 'danger');
        return;
      }

      const result = registerUser(name, email, phone, password);
      if (result.success) {
        showAlert('alertBox', 'Account created successfully! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 900);
      } else {
        showAlert('alertBox', result.message, 'danger');
      }
    });
  </script>
</body>
</html>
